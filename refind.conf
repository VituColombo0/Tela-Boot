# Seletor de boot (Grubz/rEFInd) - Dell OptiPlex 9020, tela 1280x1024
# Os marcadores ESP_UBUNTU e ESP_WINDOWS (entre arrobas) são trocados pelo instalar.sh pelo PARTUUID de cada partição EFI.
# Mostra Ubuntu e Windows lado a lado. Sem escolha em 10 s, entra no Ubuntu
# (assim o PC volta sozinho depois de uma queda de energia e o acesso remoto continua).
timeout 10
screensaver 0
inactive_icon_brightness 32
# 0 = sem animação de deslizar: nesta Dell a animação do Grubz trava o seletor (visto no log de 16/11)
selection_animation_ms 0
use_nvram false
scanfor manual
default_selection Ubuntu
resolution 1280 1024

banner theme/background.png
banner_scale fillscreen
icons_dir theme
big_icon_size 256
small_icon_size 48
selection_big theme/selection.png
hideui label,hints,arrows,badges
showtools

menuentry "Ubuntu" {
    icon /EFI/grubz/theme/ubuntu.png
    volume @ESP_UBUNTU@
    loader /EFI/ubuntu/shimx64.efi
}

menuentry "Windows" {
    icon /EFI/grubz/theme/windows.png
    volume @ESP_WINDOWS@
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
